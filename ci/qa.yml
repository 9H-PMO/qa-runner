# Copy to .github/workflows/qa.yml in each website repo.
# Runs the 9H QA standard and attaches the scorecard as a build artifact.
#
# Triggers:
#   - every successful Vercel deployment (only when the Vercel project is connected to this GitHub repo)
#   - manually from the Actions tab, with any URL
#   - weekly against the production URL
#
# Repo settings needed:
#   secret   QA_FORM_SECRET    same value as the site's QA_FORM_SECRET env var (form journeys; skipped without it)
#   secret   QA_VERCEL_BYPASS  Vercel → Project → Settings → Deployment Protection → Protection Bypass for Automation
#   variable QA_URL            production URL, used by the weekly run
#   variable QA_STAGE          "staging" until launch, then "live" (live fails the run on any gate)
name: QA

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: URL to check (defaults to the QA_URL variable)
        required: false
      stage:
        description: staging or live
        required: false
        type: choice
        options: ['', staging, live]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  qa:
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      URL: ${{ github.event.deployment_status.target_url || inputs.url || vars.QA_URL }}
      STAGE: ${{ inputs.stage || (github.event.deployment.environment == 'Preview' && 'staging') || vars.QA_STAGE || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: 9H-PMO/qa-runner
          # Pinned to a reviewed release: CI never runs unreviewed runner code with this repo's secrets.
          ref: v1.2.0
          path: .qa-runner
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # ubuntu-latest ships Google Chrome, which the runner uses for Playwright and Lighthouse.
      - run: npm ci --prefix .qa-runner
      - name: Run QA
        # shell: bash adds -o pipefail, so a runner crash fails the job instead of hiding behind `| tee`
        shell: bash
        env:
          QA_VERCEL_BYPASS: ${{ secrets.QA_VERCEL_BYPASS }}
          QA_FORM_SECRET: ${{ secrets.QA_FORM_SECRET }}
        run: |
          test -n "$URL" || { echo "No URL: pass one or set the QA_URL repo variable"; exit 1; }
          node .qa-runner/bin/qa.mjs "$URL" --project "${{ github.event.repository.name }}" --stage "$STAGE" --out qa-report \
            $([ "$STAGE" = live ] && echo --strict) | tee qa-summary.txt
      - name: Summary
        if: always()
        run: |
          { echo '```'; cat qa-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-report
          path: qa-report
